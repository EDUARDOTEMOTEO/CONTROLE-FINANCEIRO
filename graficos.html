<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gráficos - Controle Financeiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <header>
    <h1>📈 Painel de Gráficos</h1>
  </header>
  <div class="container">
    <nav class="sidebar">
      <h2>Menu</h2>
      <ul>
        <li><a href="index.html">🏠 Início</a></li>
        <li><a href="tabela.html">📋 Tabela Financeira</a></li>
        <li><a href="graficos.html" class="active">📈 Gráficos</a></li>
      </ul>
    </nav>
    <main class="main-content">
      <div id="chart-pie"></div>
    </main>
  </div>
  <script>
    const dados = JSON.parse(localStorage.getItem("dados_tabela")) || [];
    let entradas = 0;
    let saidas = 0;

    dados.forEach(row => {
      const tipo = (row[3] || "").toLowerCase();
      const val = parseFloat((row[4] || "0").replace("R$", "").replace(",", ".")) || 0;
      if (tipo === "entrada") entradas += val;
      if (tipo === "saída" || tipo === "saida") saidas += val;
    });

    const dataPie = [{
      values: [entradas, saidas],
      labels: ['Entradas', 'Saídas'],
      type: 'pie',
      marker: { colors: ['#27ae60', '#c0392b'] }
    }];

    const layout = { title: 'Entradas vs Saídas (Resumo do LocalStorage)' };
    Plotly.newPlot('chart-pie', dataPie, layout);
  </script>
</body>
</html>
